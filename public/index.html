<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ai Army</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">
  <header>
    <h1>Ai Army</h1>
    <span class="date" id="today-date"></span>
  </header>

  <!-- ── Habits Tab ── -->
  <div class="tab-content active" id="tab-habits">
    <div class="section-header">
      <h2>Habits</h2>
      <button class="btn-add" onclick="document.getElementById('habit-add-form').classList.toggle('open')">+ Add</button>
    </div>

    <div class="add-form" id="habit-add-form">
      <input id="habit-name" type="text" placeholder="Habit name (e.g. Morning run)">
      <div class="form-row">
        <select id="habit-frequency">
          <option value="daily">Daily</option>
          <option value="weekdays">Weekdays</option>
          <option value="weekly">Weekly</option>
        </select>
        <input id="habit-color" type="color" value="#4f46e5" style="width:48px;padding:4px;">
      </div>
      <button class="btn-submit" onclick="submitHabit()">Save Habit</button>
    </div>

    <div id="habit-list"></div>
  </div>

  <!-- ── Tasks Tab ── -->
  <div class="tab-content" id="tab-tasks">
    <div class="section-header">
      <h2>Tasks</h2>
      <button class="btn-add" onclick="document.getElementById('task-add-form').classList.toggle('open')">+ Add</button>
    </div>

    <div class="add-form" id="task-add-form">
      <input id="task-title" type="text" placeholder="What needs to get done?">
      <input id="task-due" type="date" placeholder="Due date (optional)">
      <button class="btn-submit" onclick="submitTask()">Save Task</button>
    </div>

    <div id="task-list"></div>
  </div>

  <!-- ── Dashboard Tab ── -->
  <div class="tab-content" id="tab-dashboard">
    <div class="section-header">
      <h2>Dashboard</h2>
      <span class="date" id="dash-date"></span>
    </div>

    <!-- Stat cards -->
    <div class="dash-stats" id="dash-stats"></div>

    <!-- Best streak -->
    <div class="dash-block" id="dash-best-streak"></div>

    <!-- Habits at a glance -->
    <div class="dash-block">
      <div class="dash-block-title">Habits today</div>
      <div id="dash-habits"></div>
    </div>

    <!-- Due today -->
    <div class="dash-block" id="dash-due-today-block">
      <div class="dash-block-title">Due today</div>
      <div id="dash-due-today"></div>
    </div>

    <!-- Due soon -->
    <div class="dash-block" id="dash-due-soon-block">
      <div class="dash-block-title">Coming up (next 3 days)</div>
      <div id="dash-due-soon"></div>
    </div>
  </div>

  <!-- ── Bottom Nav ── -->
  <nav>
    <button class="active" onclick="switchTab('habits', this)">
      <span class="icon">🔥</span>Habits
    </button>
    <button onclick="switchTab('tasks', this)">
      <span class="icon">✅</span>Tasks
    </button>
    <button onclick="switchTab('dashboard', this)">
      <span class="icon">📊</span>Dashboard
    </button>
  </nav>
</div>

<!-- Heatmap modal -->
<div class="heatmap-modal" id="heatmap-modal" onclick="closeHeatmap()">
  <div class="heatmap-sheet" onclick="event.stopPropagation()">
    <h3 id="heatmap-title"></h3>
    <div class="heatmap-grid" id="heatmap-grid"></div>
    <button class="btn-close" onclick="closeHeatmap()">Close</button>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/habits.js"></script>
<script src="/js/tasks.js"></script>
<script src="/js/dashboard.js"></script>
<script>
  // Set today's date in header
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'short', month: 'short', day: 'numeric'
  });

  function switchTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
  }

  // Initial load
  loadHabits();
  loadTasks();
  loadDashboard();
</script>
</body>
</html>
